<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Юнитка</title>
  <meta name="theme-color" content="#E7ECF1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Юнитка">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/">Юнитка</a>
    <nav class="top-nav" id="nav" hidden aria-label="Разделы">
      <a href="#/" data-nav="home"><span class="ico" aria-hidden="true">◉</span>Главная</a>
      <a href="#/products" data-nav="products"><span class="ico" aria-hidden="true">▤</span>Товары</a>
      <a href="#/profit" data-nav="profit"><span class="ico" aria-hidden="true">₽</span>Прибыль</a>
      <a href="#/report" data-nav="report"><span class="ico" aria-hidden="true">▥</span>Отчёт</a>
      <a href="#/settings" data-nav="settings"><span class="ico" aria-hidden="true">⚙</span>Настройки</a>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-json" accept=".json,application/json" hidden>
  <input type="file" id="file-cost" accept=".csv,.xlsx,.xls,text/csv" hidden>

  <script src="demo-data.js?v=6"></script>
  <script src="app.js?v=6"></script>
  <p id="pwa-status" class="pwa-status" aria-live="polite"></p>
  <style>
    .pwa-status { margin: 24px 16px calc(16px + env(safe-area-inset-bottom)); text-align: center; font-size: .8rem; color: var(--ink-2); }
    @media (max-width: 720px) { .pwa-status { margin-bottom: calc(88px + env(safe-area-inset-bottom)); } }
  </style>
  <script>
    // Работа без интернета (service worker, файл sw.js) — включаем сразу, не ждём шрифты
    (function () {
      const out = document.getElementById("pwa-status");
      const say = (t) => { out.textContent = t; };
      if (!("serviceWorker" in navigator)) { say("Без интернета: этот браузер не умеет"); return; }
      say("Без интернета: готовлю… не закрывайте пару секунд");
      navigator.serviceWorker.register("sw.js").catch((e) => say("Без интернета: ошибка — " + e.message));
      navigator.serviceWorker.ready.then(async () => {
        const key = (await caches.keys()).find((k) => k.startsWith("unitka-")) || "?";
        const ok = await caches.match("index.html");
        say(ok ? "✓ Работает без интернета (" + key.replace("unitka-", "") + ")" : "Без интернета: файлы ещё не сохранены");
      });
    })();
  </script>
</body>
</html>
