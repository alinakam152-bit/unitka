<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14728A"/>
      <stop offset="1" stop-color="#0B4756"/>
    </linearGradient>
  </defs>
  <!-- фон во весь квадрат: телефон сам скруглит углы -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- буква «Ю»: палочка + перемычка + кольцо-диаграмма -->
  <rect x="104" y="146" width="46" height="220" rx="10" fill="#E7ECF1"/>
  <rect x="140" y="234" width="46" height="44" fill="#E7ECF1"/>
  <circle cx="294" cy="256" r="92" fill="none" stroke="#E7ECF1" stroke-width="46"/>
  <!-- зелёный сектор = маржа -->
  <circle cx="294" cy="256" r="92" fill="none" stroke="#4FD08C" stroke-width="46"
          pathLength="100" stroke-dasharray="32 68" transform="rotate(-90 294 256)"/>
</svg>
