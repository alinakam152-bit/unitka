# Ночное обновление данных Юнитки: забрать отчёты WB и Ozon, посчитать, зашифровать, сохранить data.enc.
name: Обновить данные

on:
  schedule:
    - cron: "0 0 * * *"   # каждый день в 00:00 UTC = 05:00 по Екатеринбургу
  workflow_dispatch:       # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Забрать данные и зашифровать
        env:
          UNITKA_PHRASE: ${{ secrets.UNITKA_PHRASE }}
          WB_KOMILFO_TOKEN: ${{ secrets.WB_KOMILFO_TOKEN }}
          OZON_FORYOU_CLIENT_ID: ${{ secrets.OZON_FORYOU_CLIENT_ID }}
          OZON_FORYOU_API_KEY: ${{ secrets.OZON_FORYOU_API_KEY }}
          OZON_MALINOF_CLIENT_ID: ${{ secrets.OZON_MALINOF_CLIENT_ID }}
          OZON_MALINOF_API_KEY: ${{ secrets.OZON_MALINOF_API_KEY }}
          OZON_MANGUSTIN_CLIENT_ID: ${{ secrets.OZON_MANGUSTIN_CLIENT_ID }}
          OZON_MANGUSTIN_API_KEY: ${{ secrets.OZON_MANGUSTIN_API_KEY }}
          OZON_FORYOU_PERFORMANCE_CLIENT_ID: ${{ secrets.OZON_FORYOU_PERFORMANCE_CLIENT_ID }}
          OZON_FORYOU_PERFORMANCE_CLIENT_SECRET: ${{ secrets.OZON_FORYOU_PERFORMANCE_CLIENT_SECRET }}
          OZON_MALINOF_PERFORMANCE_CLIENT_ID: ${{ secrets.OZON_MALINOF_PERFORMANCE_CLIENT_ID }}
          OZON_MALINOF_PERFORMANCE_CLIENT_SECRET: ${{ secrets.OZON_MALINOF_PERFORMANCE_CLIENT_SECRET }}
          OZON_MANGUSTIN_PERFORMANCE_CLIENT_ID: ${{ secrets.OZON_MANGUSTIN_PERFORMANCE_CLIENT_ID }}
          OZON_MANGUSTIN_PERFORMANCE_CLIENT_SECRET: ${{ secrets.OZON_MANGUSTIN_PERFORMANCE_CLIENT_SECRET }}
        run: node robot/run.mjs
      - name: Сохранить data.enc
        run: |
          git config user.name "unitka-robot"
          git config user.email "unitka-robot@users.noreply.github.com"
          git add data.enc
          git diff --cached --quiet || git commit -m "Данные за $(date -u +%Y-%m-%d)"
          git push
