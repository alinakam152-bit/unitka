# Открытые данные Юнитки (без ключей): курсы ЦБ и новости WB/Ozon → data.json.
# Отдельно от ночного робота update.yml, чтобы работать, даже пока робот выключен.
name: Открытые данные (курсы и новости)

on:
  schedule:
    - cron: "0 3,9 * * *"   # 03:00 и 09:00 UTC = 08:00 и 14:00 по Екатеринбургу
  workflow_dispatch:         # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: open-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать курсы и новости
        run: python fetch.py
      - name: Сохранить data.json
        run: |
          git config user.name "unitka-robot"
          git config user.email "unitka-robot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then echo "Нечего сохранять"; exit 0; fi
          git commit -m "Открытые данные: $(TZ=Asia/Yekaterinburg date '+%d.%m.%Y %H:%M') Екб"
          git pull --rebase
          git push
